<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Foxcam — 在线试用</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #1a1a24;
    color: #e0e0e8;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
  }

  .window {
    width: 100%;
    max-width: 960px;
    background: #2a2a38;
    border-radius: 12px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    overflow: hidden;
    user-select: none;
  }

  /* Title bar */
  .titlebar {
    display: flex;
    align-items: center;
    padding: 10px 14px;
    background: #1e1e2a;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .titlebar-icon {
    width: 20px; height: 20px;
    background: linear-gradient(135deg, #f97316, #ea580c);
    border-radius: 4px;
    margin-right: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: bold; color: #fff;
  }
  .titlebar-title { font-size: 13px; color: #bbb; flex: 1; }
  .titlebar-btns { display: flex; gap: 8px; }
  .titlebar-btns span {
    width: 28px; height: 22px; border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 12px; color: #aaa;
    transition: background 0.15s;
  }
  .titlebar-btns span:hover { background: rgba(255,255,255,0.08); }
  .titlebar-btns .close:hover { background: #e81123; color: #fff; }

  /* App header */
  .app-header {
    display: flex; align-items: center; gap: 16px;
    padding: 14px 16px;
    background: #242430;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .app-logo {
    font-size: 20px; font-weight: 800;
    background: linear-gradient(135deg, #f97316, #fb923c);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: -0.02em;
  }
  .app-logo span { color: #e0e0e8; -webkit-text-fill-color: #e0e0e8; font-weight: 700; }
  .app-btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 14px; border-radius: 6px;
    background: #2f2f3e; color: #ccc;
    border: 1px solid rgba(255,255,255,0.06);
    font-size: 13px; cursor: pointer;
    transition: all 0.15s;
  }
  .app-btn:hover { background: #3a3a4d; color: #fff; }
  .app-btn.active { background: rgba(249,115,22,0.15); color: #f97316; border-color: rgba(249,115,22,0.3); }
  .app-btn .dot { width: 6px; height: 6px; border-radius: 50%; background: #f97316; }
  .spacer { flex: 1; }
  .header-right { display: flex; align-items: center; gap: 12px; }
  .header-right .label { font-size: 12px; color: #888; display: inline-flex; align-items: center; gap: 4px; }
  .header-right .label::before { content: '⚡'; font-size: 11px; }
  .header-right select {
    background: #2f2f3e; color: #ccc; border: 1px solid rgba(255,255,255,0.08);
    padding: 5px 10px; border-radius: 5px; font-size: 13px; cursor: pointer;
  }
  .header-right .top-btn {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 5px 12px; border-radius: 5px;
    background: rgba(249,115,22,0.12); color: #f97316;
    border: 1px solid rgba(249,115,22,0.3);
    font-size: 13px; cursor: pointer;
  }

  /* Toolbar */
  .toolbar {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 16px;
    background: #22222e;
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  .toolbar .combo-label {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 13px; color: #aaa;
  }
  .toolbar select {
    flex: 1; max-width: 280px;
    background: #2f2f3e; color: #ccc; border: 1px solid rgba(255,255,255,0.08);
    padding: 6px 10px; border-radius: 5px; font-size: 13px; cursor: pointer;
  }
  .toolbar-btn {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 6px 14px; border-radius: 5px;
    background: #2f2f3e; color: #ccc;
    border: 1px solid rgba(255,255,255,0.06);
    font-size: 13px; cursor: pointer;
    transition: all 0.15s;
  }
  .toolbar-btn:hover { background: #3a3a4d; color: #fff; }
  .toolbar-btn.primary { background: #f97316; color: #fff; border-color: #f97316; }
  .toolbar-btn.primary:hover { background: #fb923c; }
  .toolbar-btn.danger { color: #e87c7c; }
  .toolbar-btn.danger:hover { background: rgba(232,124,124,0.15); }

  /* Camera tabs */
  .camera-tabs {
    display: flex; gap: 2px;
    padding: 10px 16px 0;
    background: #1e1e2a;
  }
  .cam-tab {
    padding: 8px 18px; border-radius: 6px 6px 0 0;
    background: #2a2a38; color: #bbb;
    font-size: 13px; cursor: pointer;
    border: 1px solid rgba(255,255,255,0.05);
    border-bottom: none;
    transition: all 0.15s;
  }
  .cam-tab:hover { background: #333344; color: #fff; }
  .cam-tab.active {
    background: #3a3a4d; color: #fff;
    border-color: rgba(249,115,22,0.2);
  }

  /* Content */
  .content { padding: 18px 16px; }
  .cam-title {
    font-size: 16px; font-weight: 600; margin-bottom: 16px;
    color: #e0e0e8;
  }

  /* Slider rows */
  .sliders { display: flex; flex-direction: column; gap: 14px; }
  .slider-row {
    display: grid;
    grid-template-columns: 80px 1fr 60px auto;
    align-items: center;
    gap: 10px;
  }
  .slider-label { font-size: 13px; color: #aaa; }
  .slider-wrap { display: flex; align-items: center; gap: 10px; }
  input[type="range"] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 4px; border-radius: 2px;
    background: #3a3a4d; outline: none; cursor: pointer;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 16px; height: 16px; border-radius: 50%;
    background: #e0e0e8; border: 2px solid #555;
    cursor: pointer; transition: all 0.15s;
  }
  input[type="range"]::-webkit-slider-thumb:hover {
    background: #f97316; border-color: #f97316;
  }
  input[type="range"].auto-on {
    background: rgba(249,115,22,0.3);
  }
  input[type="range"].auto-on::-webkit-slider-thumb {
    background: #f97316; border-color: #f97316;
  }
  .slider-value {
    font-size: 13px; color: #ccc;
    text-align: right; min-width: 32px;
  }
  .auto-check {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 12px; color: #888; cursor: pointer;
  }
  .auto-check input[type="checkbox"] {
    width: 14px; height: 14px; accent-color: #f97316;
    cursor: pointer;
  }
  .auto-check.checked { color: #f97316; }

  /* Info bar */
  .info-bar {
    margin-top: 18px;
    padding: 10px 14px;
    background: rgba(249,115,22,0.08);
    border: 1px solid rgba(249,115,22,0.2);
    border-radius: 8px;
    font-size: 12px;
    color: #f97316;
  }
  .info-bar.hidden { display: none; }

  /* Language hide */
  .hidden-en { display: none !important; }
  body.lang-en .hidden-zh { display: none !important; }
  body.lang-en .hidden-en { display: inline !important; }
  body.lang-en .hidden-en.block { display: block !important; }
  body.lang-en .hidden-en.flex { display: flex !important; }

  /* Hint badge */
  .try-badge {
    position: fixed; top: 20px; right: 20px; z-index: 1000;
    background: rgba(249,115,22,0.95); color: #fff;
    padding: 8px 16px; border-radius: 20px;
    font-size: 13px; font-weight: 500;
    box-shadow: 0 4px 16px rgba(249,115,22,0.4);
    animation: pulse 2s ease-in-out infinite;
    cursor: pointer;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }
</style>
</head>
<body>

<div class="try-badge hidden-zh" onclick="location.href='index.html'">← 返回官网</div>
<div class="try-badge hidden-en" onclick="location.href='index.html'" style="display:none">← Back</div>

<div class="window">
  <!-- Title bar -->
  <div class="titlebar">
    <div class="titlebar-icon">F</div>
    <div class="titlebar-title">Foxcam <span class="hidden-zh">v1.0</span><span class="hidden-en">v1.0</span></div>
    <div class="titlebar-btns">
      <span>—</span><span>□</span><span class="close">✕</span>
    </div>
  </div>

  <!-- App header -->
  <div class="app-header">
    <div class="app-logo">Fox<span class="hidden-zh">cam</span><span class="hidden-en">cam</span></div>
    <button class="app-btn" id="btnScan">🔍 <span class="hidden-zh">扫描</span><span class="hidden-en">Scan</span></button>
    <button class="app-btn">🔄 <span class="hidden-zh">重读</span><span class="hidden-en">Rescan</span></button>
    <button class="app-btn">↺ <span class="hidden-zh">默认</span><span class="hidden-en">Reset</span></button>
    <div class="spacer"></div>
    <div class="header-right">
      <span class="label"><span class="hidden-zh">防闪烁</span><span class="hidden-en">Anti-flicker</span></span>
      <select>
        <option>50 Hz</option>
        <option>60 Hz</option>
      </select>
      <button class="top-btn">📌 <span class="hidden-zh">置顶</span><span class="hidden-en">Pin</span></button>
    </div>
  </div>

  <!-- Toolbar -->
  <div class="toolbar">
    <span class="combo-label">🎛 <span class="hidden-zh">组合</span><span class="hidden-en">Combo</span></span>
    <select>
      <option><span class="hidden-zh">默认</span><span class="hidden-en">Default</span></option>
      <option><span class="hidden-zh">会议模式</span><span class="hidden-en">Meeting</span></option>
      <option><span class="hidden-zh">直播模式</span><span class="hidden-en">Streaming</span></option>
    </select>
    <button class="toolbar-btn primary">▶ <span class="hidden-zh">应用</span><span class="hidden-en">Apply</span></button>
    <button class="toolbar-btn">💾 <span class="hidden-zh">保存</span><span class="hidden-en">Save</span></button>
    <button class="toolbar-btn">▼</button>
    <div class="spacer"></div>
    <button class="toolbar-btn">✏️ <span class="hidden-zh">重命名</span><span class="hidden-en">Rename</span></button>
    <button class="toolbar-btn danger">🗑 <span class="hidden-zh">删除</span><span class="hidden-en">Delete</span></button>
  </div>

  <!-- Camera tabs -->
  <div class="camera-tabs" id="cameraTabs">
    <div class="cam-tab active" data-cam="0">Logitech Webcam C925e A</div>
    <div class="cam-tab" data-cam="1">Logitech Webcam C925e B</div>
    <div class="cam-tab" data-cam="2">HP Wide Vision HD Camera</div>
  </div>

  <!-- Content -->
  <div class="content">
    <div class="cam-title" id="camTitle">Logitech Webcam C925e A</div>
    <div class="sliders" id="sliders">
      <!-- Generated by JS -->
    </div>
    <div class="info-bar hidden" id="infoBar">
      <span class="hidden-zh">参数已更新 · 点击滑块或复选框体验交互效果</span>
      <span class="hidden-en">Parameters updated · Try sliders and checkboxes</span>
    </div>
  </div>
</div>

<script>
  const paramData = [
    { key: 'brightness', labelZh: '亮度', labelEn: 'Brightness', value: 128, min: 0, max: 255, auto: false },
    { key: 'contrast', labelZh: '对比度', labelEn: 'Contrast', value: 128, min: 0, max: 255, auto: false },
    { key: 'saturation', labelZh: '饱和度', labelEn: 'Saturation', value: 128, min: 0, max: 255, auto: false },
    { key: 'hue', labelZh: '色调', labelEn: 'Hue', value: 0, min: -180, max: 180, auto: false },
    { key: 'gamma', labelZh: '伽马', labelEn: 'Gamma', value: 100, min: 10, max: 500, auto: false },
    { key: 'whiteBalance', labelZh: '白平衡', labelEn: 'White Balance', value: 5000, min: 2500, max: 6500, auto: true },
    { key: 'exposure', labelZh: '曝光', labelEn: 'Exposure', value: 0, min: -10, max: 10, auto: true },
    { key: 'zoom', labelZh: '缩放', labelEn: 'Zoom', value: 1, min: 1, max: 10, auto: false },
    { key: 'focus', labelZh: '对焦', labelEn: 'Focus', value: 100, min: 0, max: 100, auto: true },
  ];

  const cameraData = {
    '0': { name: 'Logitech Webcam C925e A', values: { brightness: 140, contrast: 130, saturation: 128, hue: 0, gamma: 100, whiteBalance: 5200, exposure: 1, zoom: 1, focus: 80 } },
    '1': { name: 'Logitech Webcam C925e B', values: { brightness: 120, contrast: 140, saturation: 135, hue: 5, gamma: 95, whiteBalance: 5000, exposure: 0, zoom: 1, focus: 70 } },
    '2': { name: 'HP Wide Vision HD Camera', values: { brightness: 130, contrast: 120, saturation: 120, hue: 0, gamma: 105, whiteBalance: 5500, exposure: 2, zoom: 1, focus: 90 } },
  };

  function renderSliders() {
    const container = document.getElementById('sliders');
    const isEn = document.body.classList.contains('lang-en');
    container.innerHTML = paramData.map(p => `
      <div class="slider-row">
        <span class="slider-label">${isEn ? p.labelEn : p.labelZh}</span>
        <div class="slider-wrap">
          <input type="range" min="${p.min}" max="${p.max}" value="${p.value}"
            class="${p.auto ? 'auto-on' : ''}"
            data-key="${p.key}">
        </div>
        <span class="slider-value" data-value="${p.key}">${p.value}</span>
        <label class="auto-check ${p.auto ? 'checked' : ''}" data-key="${p.key}">
          <input type="checkbox" ${p.auto ? 'checked' : ''} data-key="${p.key}">
          <span>${isEn ? 'Auto' : '自动'}</span>
        </label>
      </div>
    `).join('');

    // Bind slider events
    container.querySelectorAll('input[type="range"]').forEach(input => {
      input.addEventListener('input', (e) => {
        const key = e.target.dataset.key;
        const val = parseInt(e.target.value);
        const param = paramData.find(p => p.key === key);
        param.value = val;
        container.querySelector(`[data-value="${key}"]`).textContent = val;
        // Preview effect
        const wb = container.querySelector(`input[data-key="whiteBalance"]`);
        const exp = container.querySelector(`input[data-key="exposure"]`);
        const bright = container.querySelector(`input[data-key="brightness"]`);
        const r = g = b = Math.round(255 * (bright.value / 255));
        showInfo();
      });
      input.addEventListener('change', showInfo);
    });

    // Bind auto checkbox events
    container.querySelectorAll('.auto-check').forEach(label => {
      const key = label.dataset.key;
      const param = paramData.find(p => p.key === key);
      const cb = label.querySelector('input[type="checkbox"]');
      cb.addEventListener('change', (e) => {
        param.auto = e.target.checked;
        label.classList.toggle('checked', e.target.checked);
        const slider = container.querySelector(`input[data-key="${key}"]`);
        slider.classList.toggle('auto-on', e.target.checked);
        showInfo();
      });
    });
  }

  let infoTimer = null;
  function showInfo() {
    const bar = document.getElementById('infoBar');
    bar.classList.remove('hidden');
    clearTimeout(infoTimer);
    infoTimer = setTimeout(() => bar.classList.add('hidden'), 2000);
  }

  // Camera tab switching
  document.querySelectorAll('.cam-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.cam-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      const camId = tab.dataset.cam;
      const cam = cameraData[camId];
      document.getElementById('camTitle').textContent = cam.name;
      // Restore values
      paramData.forEach(p => {
        if (cam.values[p.key] !== undefined) {
          p.value = cam.values[p.key];
        }
      });
      renderSliders();
      showInfo();
    });
  });

  // Scan button
  document.getElementById('btnScan').addEventListener('click', () => {
    showInfo();
  });

  // Init language from localStorage
  const savedLang = localStorage.getItem('foxcam-lang') || 'zh';
  if (savedLang === 'en') {
    document.body.classList.add('lang-en');
    document.querySelectorAll('.hidden-en').forEach(el => {
      if (el.tagName === 'SPAN') el.style.display = 'inline';
      if (el.classList.contains('block')) el.style.display = 'block';
      if (el.classList.contains('flex')) el.style.display = 'flex';
    });
  }

  // Init
  renderSliders();
</script>

</body>
</html>
